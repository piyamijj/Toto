name: Haftalık eğitim ve backtest
on:
  schedule:
    - cron: "0 4 * * 1"   # Her pazartesi 04:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/train.py
      - name: Bülteni yenile (Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/refresh_bulletin.py
      - name: Backtest (bir önceki tamamlanmış sezon)
        run: |
          Y=$(date +%Y); M=$(date +%m); S=$([ "$M" -ge 7 ] && echo $((Y-1)) || echo $((Y-2)))
          python scripts/backtest.py --test-season $S --train-seasons $((S-3)) $((S-2)) $((S-1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_params.json data/backtest.json data/bulten.json
          git diff --cached --quiet || (git commit -m "Haftalık model güncellemesi" && git push)
